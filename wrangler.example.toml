# ============================================================
# Cloudflare Pages + Functions 博客（全部跑在免费套餐内）
#
# ⚠️ 这是「模板文件」，请勿直接改名为 wrangler.toml 后提交到 Git 仓库。
#    原因：Pages 只要发现仓库根目录存在 wrangler.toml，就会把绑定管理权
#    交给配置文件、锁死网页上的 Bindings 添加入口（详见 README 的"绑定锁坑"）。
#
# 两种用法：
#   A) 命令行部署：复制本文件为 wrangler.toml，取消下方 [[d1_databases]] /
#      [[r2_buckets]] 的注释并填入真实 database_id，再跑 wrangler 命令。
#        cp wrangler.example.toml wrangler.toml      (Windows: copy ...)
#   B) Git 集成部署（免本地）：不要生成 wrangler.toml，绑定全部在 Cloudflare
#      网页后台配置：项目 Settings → Functions → Bindings 添加
#        D1 绑定，变量名 DB   → 选你的数据库
#        R2 绑定，变量名 BLOG → 选你的存储桶
#      再在 Settings → Variables and Secrets 添加加密变量 AUTH_SECRET。
# ============================================================
name = "blog"
compatibility_date = "2025-05-01"
pages_build_output_dir = "public"

# ------------------------------------------------------------
# 以下绑定段默认注释：命令行部署时取消注释并替换 database_id。
# 数据库/存储桶的创建命令：
#   npx wrangler d1 create blog-db        # 输出里的 database_id 填到下方
#   npx wrangler r2 bucket create blog-assets
# ------------------------------------------------------------
# [vars]
# AUTH_SECRET = "改成一长串随机字符，正式环境请在网页后台用加密变量覆盖"

# [[d1_databases]]
# binding = "DB"              # 变量名必须是 DB，代码里按这个名字取用
# database_name = "blog-db"
# database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# [[r2_buckets]]
# binding = "BLOG"            # 变量名必须是 BLOG
# bucket_name = "blog-assets"
# ------------------------------------------------------------
